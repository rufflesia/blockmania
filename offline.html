<!DOCTYPE html>
<html lang="en" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Connection Lost - Blockmania</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #12141a;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #e74c3c;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #95a5a6;
            margin-bottom: 10px;
            max-width: 400px;
            line-height: 1.5;
        }
        .btn-primary {
            margin-top: 20px;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 900;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4);
            transition: all 0.2s ease;
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="icon">🔌</div>
    <h1 id="title-text">Connection Lost</h1>
    <p id="desc-text1">You currently have no internet connection or the page cannot be reached.</p>
    <p id="desc-text2">But don't worry, <b>Blockmania is designed to work offline!</b></p>
    
    <a href="./index.html" class="btn-primary" id="btn-text">Return to Game</a>

    <script>
        // Mini Sözlük (Sadece Offline Sayfası İçin)
        const offlineDict = {
            "tr": {
                "pageTitle": "Bağlantı Yok - Blockmania",
                "title": "Bağlantı Koptu",
                "desc1": "İnternet bağlantınız şu an yok veya aradığınız sayfaya ulaşılamıyor.",
                "desc2": "Ama endişelenmeyin, <b>Blockmania çevrimdışı çalışmak üzere tasarlandı!</b>",
                "btn": "Oyuna Dön"
            },
            "en": {
                "pageTitle": "Connection Lost - Blockmania",
                "title": "Connection Lost",
                "desc1": "You currently have no internet connection or the page cannot be reached.",
                "desc2": "But don't worry, <b>Blockmania is designed to work offline!</b>",
                "btn": "Return to Game"
            },
            "de": {
                "pageTitle": "Verbindung verloren - Blockmania",
                "title": "Verbindung verloren",
                "desc1": "Sie haben derzeit keine Internetverbindung oder die Seite ist nicht erreichbar.",
                "desc2": "Aber keine Sorge, <b>Blockmania ist für den Offline-Betrieb konzipiert!</b>",
                "btn": "Zurück zum Spiel"
            },
            "es": {
                "pageTitle": "Conexión perdida - Blockmania",
                "title": "Conexión perdida",
                "desc1": "Actualmente no tienes conexión a internet o no se puede acceder a la página.",
                "desc2": "Pero no te preocupes, <b>¡Blockmania está diseñado para funcionar sin conexión!</b>",
                "btn": "Volver al juego"
            },
            "zh": {
                "pageTitle": "连接丢失 - Blockmania",
                "title": "连接丢失",
                "desc1": "您当前没有互联网连接或无法访问该页面。",
                "desc2": "但是别担心，<b>Blockmania 专为离线工作而设计！</b>",
                "btn": "返回游戏"
            },
            "ru": {
                "pageTitle": "Соединение потеряно - Blockmania",
                "title": "Соединение потеряно",
                "desc1": "В настоящее время у вас нет подключения к Интернету, или страница недоступна.",
                "desc2": "Но не волнуйтесь, <b>Blockmania предназначена для работы в автономном режиме!</b>",
                "btn": "Вернуться к игре"
            },
            "az": {
                "pageTitle": "Bağlantı Yoxdur - Blockmania",
                "title": "Bağlantı Kəsildi",
                "desc1": "Hal-hazırda internet bağlantınız yoxdur və ya səhifəyə daxil olmaq mümkün deyil.",
                "desc2": "Amma narahat olmayın, <b>Blockmania oflayn işləmək üçün hazırlanmışdır!</b>",
                "btn": "Oyuna Qayıt"
            }
        };

        // Cihaz dilini tespit et (Örn: "tr-TR" -> "tr", "en-US" -> "en")
        let userLang = navigator.language || navigator.userLanguage;
        let shortLang = userLang.split('-')[0].toLowerCase();

        // Desteklenen bir dil değilse İngilizce'ye (en) düş
        if (!offlineDict[shortLang]) {
            shortLang = 'en';
        }

        // DOM Elementlerini Güncelle
        document.getElementById('html-tag').setAttribute('lang', shortLang);
        document.getElementById('page-title').innerText = offlineDict[shortLang].pageTitle;
        document.getElementById('title-text').innerText = offlineDict[shortLang].title;
        document.getElementById('desc-text1').innerText = offlineDict[shortLang].desc1;
        document.getElementById('desc-text2').innerHTML = offlineDict[shortLang].desc2;
        document.getElementById('btn-text').innerText = offlineDict[shortLang].btn;
    </script>
</body>
</html>
